  <style>
    /* CSS code giữ nguyên */
    body {
      background-image: url('images/cover-camera-chair.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: #000;
      transition: background-color 0.4s, color 0.4s, background-image 0.4s;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .gallery-grid img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      cursor: pointer;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
    }

    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .lightbox.show {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      animation: zoomIn 0.3s ease;
    }

    .lightbox-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .lightbox-button {
      background: rgba(255,255,255,0.3);
      border: none;
      color: white;
      font-size: 2em;
      cursor: pointer;
      padding: 10px 20px;
      transition: background-color 0.3s;
      border-radius: 5px;
    }

    .lightbox-button:hover {
      background: rgba(255,255,255,0.5);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2em;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .close-btn:hover {
      transform: rotate(90deg);
    }

    .download-btn {
      position: absolute;
      bottom: 30px;
      right: 40px;
      background: #FFB085;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1em;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.3s;
    }

    .download-btn:hover {
      background: #e38c6a;
      transform: translateY(-2px);
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Xem ảnh phóng to" aria-hidden="true">
        <button class="close-btn" onclick="closeLightbox()" aria-label="Đóng ảnh">&times;</button>
        <div class="lightbox-controls">
          <button class="lightbox-button" onclick="prevImage()" aria-label="Ảnh trước">&#10094;</button>
          <button class="lightbox-button" onclick="nextImage()" aria-label="Ảnh tiếp theo">&#10095;</button>
        </div>
        <img id="lightbox-img" src="" alt="Phóng to ảnh">
        <a id="downloadLink" class="download-btn" href="#" download target="_blank" aria-label="Tải ảnh về máy">⬇️ Tải ảnh</a>
      </div>
    
      <footer>
        <p>&copy; 2025 Lớp A8 - Thiết kế bởi chúng ta</p>

      <script>
        // Khởi tạo các biến
        const images = Array.from(document.querySelectorAll('.gallery-grid img'));
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const downloadLink = document.getElementById('downloadLink');
        let currentIndex = 0;
    
        // Thêm tooltip cho mỗi ảnh
        images.forEach(img => {
          const tooltip = document.createElement('div');
          tooltip.className = 'tooltip';
          tooltip.textContent = img.alt;
          img.parentElement.appendChild(tooltip);
        });
    
        // Xử lý sự kiện click ảnh
        images.forEach((img, index) => {
          img.addEventListener('click', () => {
            currentIndex = index;
            showImage();
          });
        });
    
        // Hiển thị ảnh trong lightbox
        function showImage() {
          const img = images[currentIndex];
          const fullSrc = img.dataset.full || img.src;
          
          // Preload ảnh trước khi hiển thị
          const tempImg = new Image();
          tempImg.onload = function() {
            lightboxImg.src = fullSrc;
            lightboxImg.alt = img.alt;
            downloadLink.href = fullSrc;
            lightbox.classList.add('show');
            lightbox.setAttribute('aria-hidden', 'false');
          };
          tempImg.src = fullSrc;
        }
    
        // Đóng lightbox
        function closeLightbox() {
          lightbox.classList.remove('show');
          lightbox.setAttribute('aria-hidden', 'true');
          lightboxImg.src = '';
        }
    
        // Chuyển đến ảnh tiếp theo
        function nextImage() {
          currentIndex = (currentIndex + 1) % images.length;
          showImage();
        }
    
        // Quay lại ảnh trước
        function prevImage() {
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          showImage();
        }
    
        // Xử lý sự kiện bàn phím
        document.addEventListener('keydown', e => {
          if (!lightbox.classList.contains('show')) return;
          
          switch(e.key) {
            case 'Escape':
              closeLightbox();
              break;
            case 'ArrowRight':
              nextImage();
              break;
            case 'ArrowLeft':
              prevImage();
              break;
          }
        });
    
        // Đóng lightbox khi click ra ngoài
        lightbox.addEventListener('click', e => {
          if (e.target === lightbox) closeLightbox();
        });
    
        // Xử lý dark mode
        function toggleMode() {
          document.body.classList.toggle('dark');
          localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        }
    
        // Khởi tạo dark mode từ localStorage
        window.addEventListener('DOMContentLoaded', () => {
          if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
          }
        });
    
        // Thêm gesture support cho thiết bị di động
        let touchStartX = 0;
        let touchEndX = 0;
    
        lightbox.addEventListener('touchstart', e => {
          touchStartX = e.changedTouches[0].screenX;
        }, false);
    
        lightbox.addEventListener('touchend', e => {
          touchEndX = e.changedTouches[0].screenX;
          handleSwipe();
        }, false);
    
        function handleSwipe() {
          const swipeThreshold = 50;
          const swipeLength = touchEndX - touchStartX;
    
          if (Math.abs(swipeLength) > swipeThreshold) {
            if (swipeLength > 0) {
              prevImage();
            } else {
              nextImage();
            }
          }
        }
      </script>

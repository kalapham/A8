<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng điều khiển · Lớp A8</title>
    <link rel="icon" href="../images/logo-a8.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />

    <style>
        /* ===== DESIGN TOKENS (giống hệt documents.html / login.html) ===== */
        :root, [data-theme="light"] {
            --color-bg: #fdf8f3; --color-surface: #fff9f4; --color-surface-2: #fffcfa;
            --color-surface-offset: #f7efe6; --color-divider: #e8ddd4; --color-border: #ddd0c6;
            --color-text: #2a1f14; --color-text-muted: #7a6b5e; --color-text-faint: #b8a99c;
            --color-primary: #c4600a; --color-primary-hover: #a34f08; --color-primary-active: #7d3d06;
            --color-primary-light: #fdf0e6; --color-gold: #d4a017; --color-gold-light: #fdf6e0;
            --shadow-sm: 0 1px 3px oklch(0.25 0.04 50 / 0.08);
            --shadow-md: 0 4px 14px oklch(0.25 0.04 50 / 0.10);
            --shadow-lg: 0 12px 36px oklch(0.25 0.04 50 / 0.14);
            --radius-sm: 0.375rem; --radius-md: 0.625rem; --radius-lg: 1rem; --radius-full: 9999px;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Be Vietnam Pro', system-ui, sans-serif;
            --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
            --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
            --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
            --space-12: 3rem; --space-16: 4rem; --space-20: 5rem;
            --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        [data-theme="dark"] {
            --color-bg: #18120c; --color-surface: #1f1710; --color-surface-2: #251c14;
            --color-surface-offset: #2c2218; --color-divider: #3a2e24; --color-border: #4a3c2f;
            --color-text: #f0e8de; --color-text-muted: #a08878; --color-text-faint: #6a5848;
            --color-primary: #e8884a; --color-primary-hover: #f09960; --color-primary-active: #f5aa7a;
            --color-primary-light: #2e1e0e; --color-gold: #e8c040; --color-gold-light: #2a2008;
            --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.25);
            --shadow-md: 0 4px 14px oklch(0 0 0 / 0.35);
            --shadow-lg: 0 12px 36px oklch(0 0 0 / 0.45);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body {
            font-family: var(--font-body); font-size: var(--text-base); color: var(--color-text);
            background: var(--color-bg); min-height: 100dvh; line-height: 1.65;
            transition: background 0.3s, color 0.3s; display: flex; flex-direction: column;
        }
        a { color: inherit; text-decoration: none; transition: color var(--transition); }
        button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
        table { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

        /* ===== HEADER / NAV (giống hệt các trang khác) ===== */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: oklch(from var(--color-bg) l c h / 0.88);
            backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-bottom: 1px solid var(--color-divider); transition: background 0.3s;
        }
        .header-inner {
            max-width: 1100px; margin: 0 auto; padding: var(--space-3) var(--space-6);
            display: flex; align-items: center; gap: var(--space-6); position: relative;
        }
        .logo {
            display: flex; align-items: center; gap: var(--space-2);
            font-family: var(--font-display); font-size: 1.35rem; font-weight: 700;
            color: var(--color-primary); white-space: nowrap;
        }
        .logo-mark { width: 36px; height: 36px; flex-shrink: 0; }
        .site-nav { margin-left: auto; }
        .site-nav ul { list-style: none; display: flex; gap: var(--space-1); flex-wrap: wrap; }
        .site-nav a {
            font-size: var(--text-sm); font-weight: 500; padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full); color: var(--color-text-muted);
        }
        .site-nav a:hover { background: var(--color-primary-light); color: var(--color-primary); }
        .theme-toggle {
            width: 38px; height: 38px; flex-shrink: 0; border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--color-border); color: var(--color-text-muted); background: var(--color-surface);
        }
        .icon-sun { display: none; }
        [data-theme="dark"] .icon-sun { display: block; }
        [data-theme="dark"] .icon-moon { display: none; }
        .hamburger {
            display: none; width: 38px; height: 38px; flex-shrink: 0; border-radius: var(--radius-md);
            align-items: center; justify-content: center; border: 1px solid var(--color-border);
            background: var(--color-surface); color: var(--color-text-muted);
        }

        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard-main { max-width: 1100px; margin: 0 auto; padding: var(--space-10) var(--space-6) var(--space-20); flex: 1; width: 100%; }
        .dashboard-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-10); flex-wrap: wrap; }
        .login-eyebrow {
            display: inline-flex; align-items: center; gap: var(--space-2);
            font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--color-primary); margin-bottom: var(--space-2);
        }
        .login-eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--color-primary); border-radius: 2px; }
        .dashboard-title { font-family: var(--font-display); font-size: clamp(1.75rem, 1.4rem + 1.5vw, 2.5rem); font-weight: 700; color: var(--color-text); }
        .btn-logout {
            display: inline-flex; align-items: center; gap: var(--space-2);
            padding: var(--space-2) var(--space-5); border-radius: var(--radius-full);
            border: 1px solid var(--color-border); background: var(--color-surface);
            color: var(--color-text-muted); font-size: var(--text-sm); font-weight: 600;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .btn-logout:hover { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }

        .dashboard-section { margin-bottom: var(--space-16); }
        .section-heading { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-5); }

        /* ----- Stat cards ----- */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
        .stat-card {
            position: relative; background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-gold) 100%);
        }
        .stat-card--accent::before { background: var(--color-gold); }
        .stat-label { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); margin-bottom: var(--space-2); }
        .stat-number { font-family: var(--font-display); font-size: clamp(1.5rem, 1.2rem + 1vw, 2.25rem); font-weight: 700; color: var(--color-primary); line-height: 1; }
        .stat-unit { font-size: var(--text-xs); color: var(--color-text-faint); margin-top: var(--space-1); }

        /* ----- Data table ----- */
        .table-wrapper { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
        .data-table th, .data-table td { text-align: left; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--color-divider); white-space: nowrap; }
        .data-table th { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); background: var(--color-surface-offset); }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover { background: var(--color-surface-offset); }
        .table-actions { display: flex; gap: var(--space-2); }
        .btn-edit, .btn-delete { padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; border: 1px solid var(--color-border); background: var(--color-surface); }
        .btn-edit:hover { color: var(--color-primary); border-color: var(--color-primary); }
        .btn-delete:hover { color: #b91c1c; border-color: #fca5a5; background: #fee2e2; }
        [data-theme="dark"] .btn-delete:hover { background: #2d0a0a; border-color: #7f1d1d; color: #fca5a5; }

        /* ===== FOOTER ===== */
        .site-footer { background: var(--color-surface-offset); border-top: 1px solid var(--color-divider); padding: var(--space-10) var(--space-6) var(--space-8); text-align: center; }
        .footer-copy { font-size: var(--text-xs); color: var(--color-text-faint); }

        @media (max-width: 700px) {
            .hamburger { display: flex; }
            .site-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--color-surface); border-bottom: 1px solid var(--color-divider); padding: var(--space-3); box-shadow: var(--shadow-md); }
            .site-nav.open { display: block; }
            .site-nav ul { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Ẩn toàn bộ nội dung cho tới khi xác thực xong — tránh "flash" giao diện thật
     trước khi kịp redirect. Đây CHỈ là lớp UX; bảo mật thật nằm ở API. -->
<div id="app" style="display:none;">

    <header class="site-header">
        <div class="header-inner">
            <a href="../index.html" class="logo">
                <svg class="logo-mark" viewBox="0 0 36 36" fill="none" aria-label="Logo A8">
                    <rect width="36" height="36" rx="10" fill="var(--color-primary-light)"/>
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="var(--color-primary)">A8</text>
                </svg>
                Lớp A8
            </a>
            <nav class="site-nav" id="main-nav" aria-label="Điều hướng chính">
                <ul>
                    <li><a href="../index.html">Trang chủ</a></li>
                    <li><a href="../gallery.html">Album ảnh</a></li>
                    <li><a href="../guestbook.html">Lưu bút</a></li>
                    <li><a href="../classlist.html">Danh sách lớp</a></li>
                    <li><a href="../events.html">Thông tin</a></li>
                    <li><a href="../documents.html">Tài liệu</a></li>
                </ul>
            </nav>
            <button class="theme-toggle" data-theme-toggle aria-label="Chuyển giao diện">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button class="hamburger" id="hamburger" aria-label="Mở menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="dashboard-toolbar">
            <div>
                <p class="login-eyebrow">Quản trị viên</p>
                <h1 class="dashboard-title">Bảng điều khiển</h1>
            </div>
            <button class="btn-logout" id="btn-logout" type="button">Đăng xuất</button>
        </div>

        <!-- KHU VỰC 1: Thống kê ẩn danh -->
        <section class="dashboard-section">
            <h2 class="section-heading">Thống kê truy cập (ẩn danh)</h2>
            <div class="stat-grid" id="stat-grid">
                <!-- render bằng JS từ /api/admin/analytics -->
            </div>
        </section>

        <!-- KHU VỰC 2: Quản lý tài liệu (mock UI, chưa nối API CRUD) -->
        <section class="dashboard-section">
            <h2 class="section-heading">Quản lý tài liệu</h2>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr><th>Tên tài liệu</th><th>Loại</th><th>Cập nhật</th><th></th></tr>
                    </thead>
                    <tbody id="doc-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-copy">© 2025 Lớp A8 · Niên khoá 2021–2025</p>
    </footer>
</div>

<script>
    // ============================================================
    // KIỂM TRA TOKEN NGAY KHI TẢI TRANG (yêu cầu bảo mật frontend)
    // ------------------------------------------------------------
    // Cookie JWT là HttpOnly nên JS ở đây KHÔNG THỂ tự đọc để biết
    // "có token hay không" — cách duy nhất là hỏi server. Ta tận
    // dụng luôn API lấy dữ liệu thống kê để vừa lấy data vừa đóng
    // vai trò kiểm tra: nếu trả 401 -> chưa đăng nhập/token hỏng ->
    // đá thẳng về trang login, KHÔNG hiện bất kỳ nội dung nào.
    //
    // Đây CHỈ là lớp UX. Bảo mật THẬT nằm ở /api/admin/analytics.js
    // (và mọi API admin khác) — nơi verify lại JWT từ đầu, không
    // tin bất cứ gì gửi từ client. Kể cả nếu ai đó sửa/bỏ đoạn JS
    // này, họ vẫn không lấy được data thật vì API sẽ tự chặn.
    // ============================================================
    const app = document.getElementById('app');

    async function loadDashboard() {
        try {
            const res = await fetch('/api/admin/analytics', {
                method: 'GET',
                credentials: 'same-origin',
            });

            if (res.status === 401) {
                window.location.href = 'login.html';
                return;
            }
            if (!res.ok) throw new Error(`Server trả về lỗi ${res.status}`);

            const data = await res.json();
            renderStats(data);
            renderDocs();
            app.style.display = ''; // chỉ hiện giao diện SAU KHI xác thực thành công
        } catch (err) {
            console.error('[dashboard] Không tải được dữ liệu:', err);
            // Không rõ nguyên nhân -> vẫn đưa về login cho an toàn,
            // thay vì để lộ giao diện rỗng/lỗi.
            window.location.href = 'login.html';
        }
    }

    function renderStats(data) {
        const grid = document.getElementById('stat-grid');
        grid.innerHTML = '';
        (data.views || []).forEach(item => {
            grid.insertAdjacentHTML('beforeend', `
                <div class="stat-card">
                    <p class="stat-label">${item.page}</p>
                    <p class="stat-number">${item.count.toLocaleString('vi-VN')}</p>
                    <p class="stat-unit">lượt xem</p>
                </div>`);
        });
        grid.insertAdjacentHTML('beforeend', `
            <div class="stat-card stat-card--accent">
                <p class="stat-label">Tổng lượt bấm</p>
                <p class="stat-number">${(data.totalClicks ?? 0).toLocaleString('vi-VN')}</p>
                <p class="stat-unit">clicks</p>
            </div>`);
    }

    // ----- Danh sách tài liệu: mock UI, CHƯA nối API CRUD thật -----
    function renderDocs() {
        const sampleDocs = [
            { name: 'Kỷ yếu Lớp A8.pdf', type: 'PDF', updated: '20/08/2026' },
            { name: 'Danh sách liên lạc.xlsx', type: 'Excel', updated: '15/08/2026' },
            { name: 'Ảnh tốt nghiệp.zip', type: 'ZIP', updated: '10/08/2026' },
        ];
        const tbody = document.getElementById('doc-table-body');
        tbody.innerHTML = '';
        sampleDocs.forEach(doc => {
            tbody.insertAdjacentHTML('beforeend', `
                <tr>
                    <td>${doc.name}</td><td>${doc.type}</td><td>${doc.updated}</td>
                    <td class="table-actions">
                        <button class="btn-edit" type="button">Chỉnh sửa</button>
                        <button class="btn-delete" type="button">Xoá</button>
                    </td>
                </tr>`);
        });
        // Chưa gắn onclick thật cho Chỉnh sửa/Xoá — sẽ nối API CRUD ở lượt sau.
    }

    // ----- Đăng xuất -----
    document.getElementById('btn-logout').addEventListener('click', async () => {
        try {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch (err) {
            console.error('[dashboard] Lỗi khi gọi logout:', err);
        } finally {
            // Dù API logout lỗi hay không, vẫn đưa về login — tránh kẹt ở dashboard.
            window.location.href = 'login.html';
        }
    });

    // ----- Dark mode / hamburger (giống các trang khác) -----
    (function () {
        const t = document.querySelector('[data-theme-toggle]');
        const r = document.documentElement;
        let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
        r.setAttribute('data-theme', d);
        t && t.addEventListener('click', () => { d = d === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', d); });
    })();
    document.getElementById('hamburger').addEventListener('click', () => {
        document.getElementById('main-nav').classList.toggle('open');
    });

    // ----- Chạy kiểm tra ngay khi trang tải -----
    loadDashboard();
</script>
</body>
</html>
